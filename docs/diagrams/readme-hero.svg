<svg viewBox="0 0 1200 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NLP Lab — Two NLP Models. One FastAPI Endpoint.</title>
  <desc id="d">Hero banner for NLP Lab: Word2Vec BiLSTM (5-star Amazon review rating) and DistilBERT (28-label GoEmotions) served via FastAPI with real readiness probing and zero synthetic fallback. Verified metrics: 2 active PyTorch models, 11 FastAPI endpoints, 53.57% accuracy and 0.5337 Macro-F1 on Amazon, 0.4840 Macro-F1 and 0.5917 Micro-F1 on GoEmotions, and ONNX opset 17 parity max errors of 1.19e-7 and 3.34e-6.</desc>
  <style>
    :root {
      --bg: #f3f1e9;
      --surface: #faf9f4;
      --surface-subtle: #eae8df;
      --ink: #20211c;
      --body: #20211c;
      --muted: #626459;
      --border: rgba(32, 33, 28, 0.22);
      --grid: rgba(32, 33, 28, 0.06);
      --accent: #e5ac82;
      --accent-ink: #241b15;
      --accent-txt: #8c4a1c;
      --accent-soft: rgba(229, 172, 130, 0.18);
      --ok: #3c735b;
      --track-a: #0e7c8a;
      --track-b: #5a48b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11120f;
        --surface: #191a16;
        --surface-subtle: #22231d;
        --ink: #f2f0e8;
        --body: #f2f0e8;
        --muted: #a5a69b;
        --border: rgba(242, 240, 232, 0.22);
        --grid: rgba(242, 240, 232, 0.05);
        --accent: #e5ac82;
        --accent-ink: #241b15;
        --accent-txt: #e5ac82;
        --accent-soft: rgba(229, 172, 130, 0.18);
        --ok: #9ecbbb;
        --track-a: #5fd3e0;
        --track-b: #a394f8;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Consolas, "Liberation Mono", monospace; }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); stroke: var(--border); }
    .surface-subtle { fill: var(--surface-subtle); stroke: var(--border); }
    .accent { fill: var(--accent); }
    .accent-soft { fill: var(--accent-soft); }
    .stroke-accent { stroke: var(--accent); }
    .rule { stroke: var(--border); }
    .grid { stroke: var(--grid); }
    .kicker { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    .headline { fill: var(--ink); font-size: 56px; font-weight: 700; letter-spacing: -0.025em; }
    .headline-accent { fill: var(--accent-txt); font-size: 56px; font-weight: 700; letter-spacing: -0.025em; }
    .sub { fill: var(--body); font-size: 19px; font-weight: 400; }
    .ok-txt { fill: var(--ok); font-weight: 600; }
    .cmd { fill: var(--accent-ink); font-size: 15px; font-weight: 600; }
    .foot { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .num { fill: var(--ink); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    .num-md { fill: var(--ink); font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
    .lbl { fill: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
    .cta-txt { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .dot-ok { fill: var(--ok); }
    .dot-a { fill: var(--track-a); }
    .dot-b { fill: var(--track-b); }
  </style>
  <defs>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="548"/>
  <rect x="0" y="0" width="1200" height="548" fill="url(#heroGrid)"/>

  <!-- Left Hero Column -->
  <text x="60" y="84" class="kicker">NLP LAB · DUAL-MODEL INFERENCE</text>

  <text x="60" y="162" class="headline">Two NLP Models.</text>
  <text x="60" y="238">
    <tspan class="headline">One </tspan><tspan class="headline-accent">FastAPI</tspan><tspan class="headline"> Endpoint.</tspan>
  </text>

  <line x1="60" y1="272" x2="320" y2="272" class="rule" stroke-width="1"/>
  <circle cx="60" cy="272" r="5" class="accent">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="308" class="sub">Word2Vec BiLSTM (5-star Amazon) + DistilBERT (28 GoEmotions)</text>
  <text x="60" y="338" class="sub">
    <tspan class="ok-txt">Real readiness</tspan><tspan> · Zero synthetic fallback · PyTorch runtime</tspan>
  </text>

  <!-- CLI Pill -->
  <rect x="60" y="376" width="468" height="44" rx="8" class="accent"/>
  <text x="82" y="403" class="mono cmd">$ uvicorn backend.app.main:app --port 8000</text>

  <text x="60" y="492" class="foot">TRACK A: WORD2VEC + BILSTM · TRACK B: DISTILBERT · ONNX OPSET 17 VERIFIED</text>

  <!-- Right Stats Panel -->
  <rect x="720" y="72" width="420" height="404" rx="12" class="surface" stroke-width="1"/>
  <rect x="720" y="88" width="4" height="372" rx="2" class="accent"/>

  <!-- Top 2-col counts -->
  <text x="748" y="124" class="num">2</text>
  <text x="748" y="146" class="lbl">ACTIVE PYTORCH MODELS</text>

  <text x="944" y="124" class="num">11</text>
  <text x="944" y="146" class="lbl">FASTAPI ENDPOINTS</text>

  <line x1="748" y1="168" x2="1116" y2="168" class="rule" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Amazon metrics -->
  <circle cx="753" cy="196" r="4" class="dot-a"/>
  <text x="768" y="204" class="num-md mono">53.57% / 0.5337</text>
  <text x="768" y="224" class="lbl">AMAZON ACC / MACRO-F1  (MAE 0.6225)</text>

  <!-- GoEmotions metrics -->
  <circle cx="753" cy="260" r="4" class="dot-b"/>
  <text x="768" y="268" class="num-md mono">0.4840 / 0.5917</text>
  <text x="768" y="288" class="lbl">GOEMOTIONS MACRO / MICRO-F1  (τ=0.30)</text>

  <!-- ONNX parity -->
  <circle cx="753" cy="324" r="4" class="dot-ok"/>
  <text x="768" y="332" class="num-md mono">1.19e-7 / 3.34e-6</text>
  <text x="768" y="352" class="lbl">ONNX PARITY MAX ERR  (OPSET 17 ≤ 1e-4)</text>

  <line x1="748" y1="374" x2="1116" y2="374" class="rule" stroke-width="1" stroke-opacity="0.5"/>

  <!-- CTA Pill -->
  <rect x="748" y="394" width="368" height="44" rx="8" class="accent-soft stroke-accent" stroke-width="1"/>
  <circle cx="770" cy="416" r="4.5" class="dot-ok">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="786" y="421" class="mono cta-txt">Explore /readiness &amp; /predict</text>
  <text x="1096" y="421" text-anchor="end" class="cta-txt">→</text>
</svg>
