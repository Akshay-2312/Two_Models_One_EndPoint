<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NLP Lab Six Engineering Pillars: Real Readiness Contract, Two Task-Tuned Tracks, Unchanged Model Output, Local-First and Private, ONNX Parity Verified, and CI-Tested Contracts.</title>
  <desc id="d">Six pillar cards in a 3x2 grid on a 32px hairline background grid, with left accent bars, crisp 22px stroke icons, and a subtle continuous highlight sweep.</desc>
  <style>
    :root {
      --bg: #f3f1e9;
      --surface: #faf9f4;
      --ink: #20211c;
      --body: #20211c;
      --muted: #626459;
      --border: rgba(32, 33, 28, 0.22);
      --grid: rgba(32, 33, 28, 0.06);
      --accent: #e5ac82;
      --accent-soft: rgba(229, 172, 130, 0.18);
      --ok: #3c735b;
      --warn: #8a591c;
      --info: #526b80;
      --track-a: #0e7c8a;
      --track-b: #5a48b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11120f;
        --surface: #191a16;
        --ink: #f2f0e8;
        --body: #f2f0e8;
        --muted: #a5a69b;
        --border: rgba(242, 240, 232, 0.22);
        --grid: rgba(242, 240, 232, 0.05);
        --accent: #e5ac82;
        --accent-soft: rgba(229, 172, 130, 0.18);
        --ok: #9ecbbb;
        --warn: #e5c28c;
        --info: #a6bfd0;
        --track-a: #5fd3e0;
        --track-b: #a394f8;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono-sm { font-family: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Consolas, "Liberation Mono", monospace; font-weight: 500; font-size: 11px; fill: var(--muted); }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); stroke: var(--border); }
    .rule { stroke: var(--border); }
    .grid { stroke: var(--grid); }
    .accent-soft { fill: var(--accent-soft); }
    .stroke-accent { stroke: var(--accent); }
    .kicker { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    .sub { fill: var(--body); font-size: 22px; font-weight: 400; }
    .sub-em { fill: var(--ok); font-weight: 600; }
    .h3 { fill: var(--ink); font-size: 18px; font-weight: 600; }
    .cell { fill: var(--muted); font-size: 13.5px; font-weight: 400; }
    .ok { fill: var(--ok); }
    .warn { fill: var(--warn); }
    .info { fill: var(--info); }
    .track-a { fill: var(--track-a); }
    .track-b { fill: var(--track-b); }
    .stroke-ok { stroke: var(--ok); }
    .stroke-warn { stroke: var(--warn); }
    .stroke-info { stroke: var(--info); }
    .stroke-a { stroke: var(--track-a); }
    .stroke-b { stroke: var(--track-b); }
  </style>
  <defs>
    <pattern id="pp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="540"/>
  <rect x="0" y="0" width="1200" height="540" fill="url(#pp-grid)"/>

  <!-- Header -->
  <text x="40" y="58" class="kicker">ENGINEERING GUARANTEES</text>
  <line x1="252" y1="53" x2="1160" y2="53" class="rule" stroke-width="1"/>
  <text x="40" y="100" class="sub">
    Two models. One API. <tspan class="sub-em">Honest readiness, verified parity, and zero synthetic output.</tspan>
  </text>

  <!-- Card 1: Real Readiness Contract -->
  <g>
    <rect x="40" y="130" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="40" y="130" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.055;0.12;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="146" width="4" height="132" rx="2" class="ok"/>
    <g transform="translate(66,152)" class="stroke-ok" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2,11 6,11 9,4 13,18 16,11 20,11"/>
    </g>
    <text x="102" y="170" class="h3">Real Readiness Contract</text>
    <text x="66" y="204" class="cell">/readiness probes live PyTorch bundles</text>
    <text x="66" y="226" class="cell">and reports 200 ready | not_ready;</text>
    <text x="66" y="248" class="cell">/predict/* returns 503 when absent.</text>
  </g>

  <!-- Card 2: Two Task-Tuned Tracks -->
  <g>
    <rect x="420" y="130" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="420" y="130" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.167;0.222;0.287;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="146" width="4" height="132" rx="2" class="track-a"/>
    <g transform="translate(446,152)" class="stroke-a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="11" r="3"/>
      <circle cx="17" cy="5" r="3"/>
      <circle cx="17" cy="17" r="3"/>
      <path d="M8,10 L14,6 M8,12 L14,16"/>
    </g>
    <text x="482" y="170" class="h3">Two Task-Tuned Tracks</text>
    <text x="446" y="204" class="cell">Word2Vec + 2L BiLSTM (16.73M params) for</text>
    <text x="446" y="226" class="cell">ordinal 1–5★ Amazon ratings; DistilBERT</text>
    <text x="446" y="248" class="cell">(66.98M params) for 28 GoEmotions.</text>
  </g>

  <!-- Card 3: Unchanged Model Output -->
  <g>
    <rect x="800" y="130" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="800" y="130" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.334;0.389;0.454;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="146" width="4" height="132" rx="2" class="track-b"/>
    <g transform="translate(826,152)" class="stroke-b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="6" x2="18" y2="6"/>
      <line x1="4" y1="12" x2="18" y2="12"/>
      <line x1="4" y1="18" x2="18" y2="18"/>
      <circle cx="9" cy="6" r="2.2" class="track-b" stroke="none"/>
      <circle cx="14" cy="12" r="2.2" class="track-b" stroke="none"/>
      <circle cx="8" cy="18" r="2.2" class="track-b" stroke="none"/>
    </g>
    <text x="862" y="170" class="h3">Unchanged Model Output</text>
    <text x="826" y="204" class="cell">Raw softmax probabilities and calibrated</text>
    <text x="826" y="226" class="cell">τ=0.30 sigmoid scores returned directly</text>
    <text x="826" y="248" class="cell">with zero hidden post-editing.</text>
  </g>

  <!-- Card 4: Local-First & Private -->
  <g>
    <rect x="40" y="314" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="40" y="314" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.5;0.555;0.62;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="330" width="4" height="132" rx="2" class="info"/>
    <g transform="translate(66,336)" class="stroke-info" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="14" height="10" rx="2"/>
      <path d="M7,10 V6.5 A4,4 0 0 1 15,6.5 V10"/>
    </g>
    <text x="102" y="354" class="h3">Local-First &amp; Private</text>
    <text x="66" y="388" class="cell">Self-hosted FastAPI inference with zero</text>
    <text x="66" y="410" class="cell">external LLM calls and strict dataset</text>
    <text x="66" y="432" class="cell">sample governance guards on /datasets.</text>
  </g>

  <!-- Card 5: ONNX Parity Verified -->
  <g>
    <rect x="420" y="314" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="420" y="314" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.667;0.722;0.787;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="330" width="4" height="132" rx="2" class="warn"/>
    <g transform="translate(446,336)" class="stroke-warn" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="16" height="16" rx="3"/>
      <path d="M7.5,9.5 L14.5,9.5 M7.5,13.5 L14.5,13.5"/>
    </g>
    <text x="482" y="354" class="h3">ONNX Parity Verified</text>
    <text x="446" y="388" class="cell">Opset 17 ONNX exports checked within</text>
    <text x="446" y="410" class="cell">1e-4 tolerance: 1.19e-07 (Amazon) and</text>
    <text x="446" y="432" class="cell">3.34e-06 (GoEmotions) max abs error.</text>
  </g>

  <!-- Card 6: CI-Tested Contracts -->
  <g>
    <rect x="800" y="314" width="360" height="164" rx="12" class="surface" stroke-width="1"/>
    <rect x="800" y="314" width="360" height="164" rx="12" class="accent-soft stroke-accent" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.834;0.889;0.954;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="330" width="4" height="132" rx="2" class="ok"/>
    <g transform="translate(826,336)" class="stroke-ok" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11,1.5 L19.5,5 L19.5,11 C19.5,16.5 16,19.8 11,21.5 C6,19.8 2.5,16.5 2.5,11 L2.5,5 Z"/>
      <path d="M7,11 L10,14 L15.4,8.2"/>
    </g>
    <text x="862" y="354" class="h3">CI-Tested Contracts</text>
    <text x="826" y="388" class="cell">OpenAPI drift check, Tech Manifest check,</text>
    <text x="826" y="410" class="cell">10 frontend contract test suites, and</text>
    <text x="826" y="432" class="cell">live Playwright end-to-end smoke checks.</text>
  </g>

  <!-- Footer -->
  <text x="40" y="516" class="mono-sm">$ uvicorn backend.app.main:app --port 8000  ·  http://127.0.0.1:8000/readiness</text>
  <text x="1160" y="516" text-anchor="end" class="kicker">MIT · OPEN SOURCE</text>
</svg>
