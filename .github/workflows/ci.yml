name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests

      - name: Verify OpenAPI schema artifact
        run: python scripts/export_openapi.py --check

      - name: Verify technology stack manifest
        run: python scripts/generate_technology_manifest.py --check

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Verify frontend lint, typecheck, contract tests, and build
        run: cd frontend && npm run verify

  playwright-smoke:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: cd frontend && npm run build

      - name: Install Playwright Chromium
        run: cd frontend && npm install --no-save playwright && npx playwright install chromium --with-deps

      - name: Boot Uvicorn & Next.js and run Playwright smoke suite
        run: |
          set -euo pipefail
          UVICORN_PID=""
          NEXT_PID=""
          cleanup() {
            if [ -n "${NEXT_PID}" ]; then
              kill "${NEXT_PID}" 2>/dev/null || true
            fi
            if [ -n "${UVICORN_PID}" ]; then
              kill "${UVICORN_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readiness > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${UVICORN_PID}" 2>/dev/null; then
              echo "Uvicorn exited unexpectedly:"
              cat /tmp/uvicorn.log || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readiness > /dev/null

          (cd frontend && npm run start) > /tmp/next.log 2>&1 &
          NEXT_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${NEXT_PID}" 2>/dev/null; then
              echo "Next.js server exited unexpectedly:"
              cat /tmp/next.log || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ > /dev/null

          if ! (cd frontend && CI_SMOKE_BASE_URL=http://localhost:3000 node scripts/ci-playwright-smoke.mjs); then
            echo "=== Uvicorn logs ==="
            cat /tmp/uvicorn.log || true
            echo "=== Next.js logs ==="
            cat /tmp/next.log || true
            exit 1
          fi
