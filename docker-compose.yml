services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp-lab-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nlp-lab-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
